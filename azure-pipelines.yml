# azure-pipelines.yml

trigger: none
 

pool:
  vmImage: 'ubuntu-latest'  # Use Ubuntu with Docker support

variables:
  imageName: 'myapp'  # Name of the Docker image to scan
  imageTag: 'latest'
steps:

# Step 1: Install Docker (if not already installed on agent)
- task: DockerInstaller@0
  displayName: 'Install Docker'
- script: |
    sudo systemctl start docker
  displayName: 'Start Docker Daemon'
# Step 2: Build your Docker image (optional, if you're building the image in the same pipeline)
- task: Docker@2
  displayName: 'Build Docker Image'
  inputs:
    repository: '$(imageName)'
    command: 'build'
    Dockerfile: '$(System.DefaultWorkingDirectory)/app/Dockerfile'
    tags: '$(imageTag)'
- script: |
    docker pull aquasec/trivy:latest
  displayName: 'Pull Trivy Image'





- script: |
    docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \  # Mount Docker socket
      -v $(System.DefaultWorkingDirectory):/root/.cache/ \  # Use cache directory
      aquasec/trivy:latest image --exit-code 1 --severity CRITICAL,HIGH myapp:latest
  displayName: 'Scan Docker Image with Trivy'
  failOnStderr: true

# Step 4: Publish results (optional, if you want to upload the report as a build artifact)
- task: PublishBuildArtifacts@1
  displayName: 'Publish Trivy Scan Report'
  inputs:
    path: '$(System.DefaultWorkingDirectory)/trivy-report.txt'
    artifactName: 'TrivyReport'

