pool:
  vmImage: 'ubuntu-latest'  # or windows-latest depending on your agent environment

steps:
# Step 1: Ensure Docker Daemon is Running (optional if it's already running)
- script: |
    sudo systemctl start docker
  displayName: 'Start Docker Daemon'

# Step 2: Build the Docker image locally
- script: |
    docker build -t myapp:latest ./app
  displayName: 'Build Docker Image'

# Step 3: Pull the Trivy image (optional step since the latest image is pulled when needed)
- script: |
    docker pull aquasec/trivy:latest
  displayName: 'Pull Trivy Image'

- script: |
    docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v $(System.DefaultWorkingDirectory):/root/.cache/ \
      aquasec/trivy:latest image --exit-code 1 --severity CRITICAL,HIGH myapp:latest
  displayName: 'Scan Docker Image with Trivy'
  failOnStderr: true
